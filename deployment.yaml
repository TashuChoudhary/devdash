apiVersion: apps/v1
kind: Deployment
metadata:
  name: devdash-app
  namespace: default
  labels:
    app: devdash-app
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: devdash-app
  template:
    metadata:
      labels:
        app: devdash-app
    spec:
      containers:
      - name: devdash-app
        image: devdash-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: devdash-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"